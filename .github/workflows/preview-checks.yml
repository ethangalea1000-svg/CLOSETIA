name: CLOSETIA Preview checks

on:
  push:
    branches:
      - cloudflare-pages-ready
      - audit/seo-ux-performance-2026-10
  pull_request:
    branches:
      - main
      - cloudflare-pages-migration

jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check app JavaScript syntax
        run: node --check app.js
      - name: Check Cloudflare middleware syntax
        run: node --input-type=module --check < functions/_middleware.js
      - name: Check account directory API syntax
        run: node --input-type=module --check < 'functions/api/accounts/[[path]].js'
      - name: Test snapshot merge protections
        run: node tests/preview-smoke.test.mjs
