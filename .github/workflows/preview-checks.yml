name: CLOSETIA Preview checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check app JavaScript syntax
        run: node --check app.js
      - name: Test import image filter
        run: node tests/import-images.test.mjs
      - name: Test import flow (headless Chrome)
        run: node tests/import-flow.chrome.mjs
